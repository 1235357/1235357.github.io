name: Browser contracts and Pages deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-contracts:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: browser-rag/package-lock.json
      - run: npm ci --prefix browser-rag
      - run: python -m pip install -r requirements.txt
      - name: Reconstruct pinned embedding assets
        run: python scripts/materialize-browser-assets.py --embedding-only
      - name: Browser contract checks (controlled fixtures, no GPU inference)
        run: npm test --prefix browser-rag
      - name: Build, delivery and routing contracts
        run: python -m unittest discover -p "test_*.py" -q

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: browser-rag/package-lock.json
      - run: npm ci --prefix browser-rag
      - run: python -m pip install -r requirements.txt
      - name: Reconstruct and verify immutable model assets
        run: python scripts/materialize-browser-assets.py
      - name: Browser contract checks (controlled fixtures, no GPU inference)
        run: npm test --prefix browser-rag
      - name: Build, delivery and routing contracts
        run: python -m unittest discover -p "test_*.py" -q
      - name: Build the explicit public runtime
        run: python build.py --public
      - name: Record the built file hashes and publication boundary
        run: python scripts/release-manifest.py
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - name: Retain build manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-release-manifest
          path: release-manifest.json
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, windows-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the checked artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
